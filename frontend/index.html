<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, shrink-to-fit=no">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-touch-fullscreen" content="yes">
    <meta name="theme-color" content="#FAF5EF" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#16121D" media="(prefers-color-scheme: dark)">
    <link rel="manifest" href="/manifest.json">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='128' fill='%238B5FA8'/%3E%3Cpath d='M256 120v40M256 352v40M120 256h40M352 256h40M160 160l28 28M324 324l28 28M352 160l-28 28M188 324l-28 28' stroke='%23ffffff' stroke-width='32' stroke-linecap='round'/%3E%3Ccircle cx='256' cy='256' r='64' fill='none' stroke='%23ffffff' stroke-width='32'/%3E%3C/svg%3E">
    <title>Tempo — Organizador</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
    <div id="root">
        <!-- Barra superior flotante de control de vista en navegador PC -->
    <header class="view-mode-bar" id="viewModeBar" aria-label="Selector de visualización">
        <div class="vmb-group">
            <button type="button" class="vmb-btn" id="vmbBtnMobile" data-mode="mobile"
                title="Ver con marco de teléfono móvil">
                <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2">
                    <rect x="6" y="2" width="12" height="20" rx="3" />
                    <path d="M12 18h.01" />
                </svg>
                <span>Vista Móvil</span>
            </button>
            <button type="button" class="vmb-btn" id="vmbBtnPc" data-mode="pc"
                title="Ver como aplicación de escritorio expandida">
                <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2">
                    <rect x="2" y="3" width="20" height="14" rx="2" />
                    <path d="M8 21h8M12 17v4" />
                </svg>
                <span>Vista PC</span>
            </button>
        </div>
        <div class="vmb-sizes" id="vmbSizes">
            <span class="vmb-label">Ancho:</span>
            <button type="button" class="vmb-pill on" data-w="420" title="Ancho estándar (420px)">420px</button>
            <button type="button" class="vmb-pill" data-w="450" title="Ancho grande (450px)">450px</button>
            <button type="button" class="vmb-pill" data-w="390" title="Ancho compacto (390px)">390px</button>
        </div>
        <div class="vmb-right">
            <button type="button" class="vmb-icon-btn" id="vmbBtnTheme" title="Alternar tema claro/oscuro">
                <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z" />
                </svg>
            </button>
        </div>
    </header>

    <div class="stage">
        <div class="device">
            <div id="phone">
                <div class="island" aria-hidden="true"></div>
                <div class="statusbar" aria-hidden="true">
                    <span class="sb-time" id="sbClock">9:41</span>
                    <span class="sb-icons">
                        <svg width="19" height="12" viewBox="0 0 19 12" fill="currentColor">
                            <rect x="0" y="7.5" width="3.4" height="4.5" rx="1" />
                            <rect x="5" y="5" width="3.4" height="7" rx="1" />
                            <rect x="10" y="2.5" width="3.4" height="9.5" rx="1" />
                            <rect x="15" y="0" width="3.4" height="12" rx="1" />
                        </svg>
                        <svg width="17" height="12" viewBox="0 0 17 12" fill="none" stroke="currentColor"
                            stroke-width="1.7" stroke-linecap="round">
                            <path d="M1.5 4.2a10.5 10.5 0 0 1 14 0" />
                            <path d="M4 7a7 7 0 0 1 9 0" />
                            <circle cx="8.5" cy="10" r="1.4" fill="currentColor" stroke="none" />
                        </svg>
                        <svg width="26" height="12" viewBox="0 0 26 12" fill="none">
                            <rect x=".8" y=".8" width="21" height="10.4" rx="3.2" stroke="currentColor" opacity=".4"
                                stroke-width="1" />
                            <rect x="2.5" y="2.5" width="14" height="7" rx="1.8" fill="currentColor" />
                            <path d="M23.6 4v4a2.2 2.2 0 0 0 0-4z" fill="currentColor" opacity=".4" />
                        </svg>
                    </span>
                </div>

                <div class="app">
                    <!-- Sidebar para versión de PC / Pantallas grandes -->
                    <aside class="pc-sidebar" id="pcSidebar">
                        <div class="pc-brand">
                            <div class="pc-logo" aria-hidden="true">
                                <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor"
                                    stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                                    <circle cx="12" cy="12" r="4" />
                                    <path
                                        d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.5 1.5M17.2 17.2l1.5 1.5M18.7 5.3l-1.5 1.5M6.8 17.2l-1.5 1.5" />
                                </svg>
                            </div>
                            <div class="pc-brand-text">
                                <span class="pc-title">Tempo</span>
                                <span class="pc-subtitle">Organizador</span>
                            </div>
                        </div>

                        <div class="pc-actions">
                            <button type="button" class="pc-btn-add" id="pcBtnAdd">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
                                    stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M12 5v14M5 12h14" />
                                </svg>
                                <span>Nueva entrada</span>
                                <kbd>N</kbd>
                            </button>
                            <button type="button" class="pc-btn-search" id="pcBtnSearch">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <circle cx="11" cy="11" r="7" />
                                    <path d="M20.3 20.3l-3.8-3.8" />
                                </svg>
                                <span>Buscar...</span>
                                <kbd>Ctrl+K</kbd>
                            </button>
                        </div>

                        <nav class="pc-nav" role="tablist" aria-label="Navegación principal">
                            <button type="button" class="pc-nav-item on" data-tab="today" role="tab"
                                aria-selected="true">
                                <span class="pc-nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                        stroke-width="2">
                                        <circle cx="12" cy="12" r="4" />
                                        <path
                                            d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.5 1.5M17.2 17.2l1.5 1.5M18.7 5.3l-1.5 1.5M6.8 17.2l-1.5 1.5" />
                                    </svg></span>
                                <span class="pc-nav-label">Hoy</span>
                                <span class="pc-badge" id="pcBadgeToday">0</span>
                            </button>
                            <button type="button" class="pc-nav-item" data-tab="calendar" role="tab"
                                aria-selected="false">
                                <span class="pc-nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                        stroke-width="2">
                                        <rect x="3.2" y="4.8" width="17.6" height="16" rx="3" />
                                        <path d="M3.2 9.8h17.6M8 2.8v4M16 2.8v4" />
                                    </svg></span>
                                <span class="pc-nav-label">Calendario</span>
                            </button>
                            <button type="button" class="pc-nav-item" data-tab="lists" role="tab" aria-selected="false">
                                <span class="pc-nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                        stroke-width="2">
                                        <path d="M8.5 6h12M8.5 12h12M8.5 18h12" />
                                        <path d="M4 6h.01M4 12h.01M4 18h.01" stroke-width="2.8" />
                                    </svg></span>
                                <span class="pc-nav-label">Listas</span>
                            </button>
                        </nav>

                        <div class="pc-sec">
                            <div class="pc-sec-head">
                                <span>Colecciones</span>
                                <button type="button" class="pc-btn-plus" data-act="newlist"
                                    title="Crear nueva lista">+</button>
                            </div>
                            <div class="pc-sub-nav" id="pcSidebarLists"></div>
                        </div>

                        <div class="pc-sidebar-footer">
                            <div class="pc-status">
                                <span class="status-dot"></span>
                                <span>Backend SQLite conectado</span>
                            </div>
                            <div class="pc-footer-btns">
                                <button type="button" class="pc-fbtn" id="pcBtnTheme" title="Alternar tema">
                                    <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor"
                                        stroke-width="2">
                                        <path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z" />
                                    </svg>
                                    <span>Tema</span>
                                </button>
                                <button type="button" class="pc-fbtn" data-act="reseed" title="Restaurar datos semilla">
                                    <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor"
                                        stroke-width="2">
                                        <path d="M3.5 4.5v5.5h5.5" />
                                        <path d="M4.6 14.5a8 8 0 1 0 1.5-7.6L3.5 10" />
                                    </svg>
                                    <span>Reset</span>
                                </button>
                                <button type="button" class="pc-fbtn" id="pcBtnPreviewMobile"
                                    title="Alternar marco de teléfono móvil">
                                    <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor"
                                        stroke-width="2">
                                        <rect x="5" y="2" width="14" height="20" rx="3" />
                                        <path d="M12 18h.01" />
                                    </svg>
                                    <span>Móvil</span>
                                </button>
                            </div>
                        </div>
                    </aside>

                    <!-- Área principal de la aplicación -->
                    <div class="app-main">
                        <header class="nav" id="nav">
                            <div class="nav-l">
                                <button type="button" class="nav-back" id="btnBack" aria-label="Volver">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"
                                        stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                        <path d="M15 18l-6-6 6-6" />
                                    </svg>
                                    <span>Atrás</span>
                                </button>
                            </div>
                            <div class="nav-c" id="navTitle"></div>
                            <div class="nav-r">
                                <button type="button" class="nav-btn" id="btnSearch" aria-label="Buscar"><svg
                                        viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                                        stroke-linecap="round" aria-hidden="true">
                                        <circle cx="11" cy="11" r="7" />
                                        <path d="M20.3 20.3l-3.8-3.8" />
                                    </svg></button>
                                <button type="button" class="nav-btn" id="btnThemeNav"
                                    aria-label="Cambiar tema claro / oscuro" title="Cambiar tema claro / oscuro">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                                        stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                        <path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z" />
                                    </svg>
                                </button>
                                <button type="button" class="nav-btn" id="btnAdd" aria-label="Añadir"><svg
                                        viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
                                        stroke-linecap="round" aria-hidden="true">
                                        <path d="M12 5v14M5 12h14" />
                                    </svg></button>
                            </div>
                        </header>

                        <div class="views" id="views">
                            <section class="view on" id="v-today" role="tabpanel" aria-label="Hoy">
                                <div class="pad" id="c-today"></div>
                            </section>
                            <section class="view" id="v-calendar" role="tabpanel" aria-label="Calendario">
                                <div class="pad" id="c-calendar"></div>
                            </section>
                            <section class="view" id="v-lists" role="tabpanel" aria-label="Listas">
                                <div class="pad" id="c-lists"></div>
                            </section>
                            <section class="view detail" id="v-detail" role="tabpanel" aria-label="Detalle">
                                <div class="pad" id="c-detail"></div>
                            </section>
                        </div>
                    </div>

                </div>

                <div class="searchscreen" id="searchScreen" role="dialog" aria-modal="true" aria-label="Buscar">
                    <div class="shead">
                        <div class="sfield">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                                stroke-linecap="round" aria-hidden="true">
                                <circle cx="11" cy="11" r="7" />
                                <path d="M20.3 20.3l-3.8-3.8" />
                            </svg>
                            <input id="sInput" placeholder="Eventos, tareas, artículos…" aria-label="Buscar"
                                autocomplete="off">
                        </div>
                        <button type="button" class="scancel" id="btnSCancel">Cancelar</button>
                    </div>
                    <div class="s-filters" id="sFilters" role="tablist" aria-label="Filtros de búsqueda">
                        <button type="button" class="s-chip on" data-filter="all">Todo</button>
                        <button type="button" class="s-chip" data-filter="event">Eventos</button>
                        <button type="button" class="s-chip" data-filter="routine">Rutinas</button>
                        <button type="button" class="s-chip" data-filter="task">Tareas</button>
                        <button type="button" class="s-chip" data-filter="reminder">Recordatorios</button>
                        <button type="button" class="s-chip" data-filter="shopping">Compras</button>
                        <button type="button" class="s-chip" data-filter="birthday">Cumpleaños</button>
                        <button type="button" class="s-chip" data-filter="wish">Deseos</button>
                    </div>
                    <div class="sres pad" id="sRes" style="padding-top:6px"></div>
                    <div class="shint" id="sHint">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
                            stroke-linecap="round" aria-hidden="true">
                            <circle cx="11" cy="11" r="7" />
                            <path d="M20.3 20.3l-3.8-3.8" />
                        </svg>
                        <span>Busca en todos tus eventos, tareas,<br>compras, deseos y cumpleaños</span>
                    </div>
                </div>

                <div class="sheetwrap" id="sheetwrap">
                    <div class="scrim" id="scrim"></div>
                    <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="shTitle">
                        <div class="grabber" id="grabber" aria-hidden="true"></div>
                        <header class="sheet-head" id="sheetHead">
                            <button type="button" class="sh-cancel" id="shCancel">Cancelar</button>
                            <div class="sh-title" id="shTitle"></div>
                            <button type="button" class="sh-done" id="shDone">Añadir</button>
                        </header>
                        <div class="sheet-body" id="sheetBody"></div>
                    </div>
                </div>

                <div class="toasts" id="toasts" role="status" aria-live="polite"></div>
                <div class="homebar" aria-hidden="true"></div>
            </div>
        </div>
        <div class="caption">Tempo · maqueta interactiva — en tu iPhone se abre a pantalla completa</div>
    </div>

    <!-- Tabbar fuera de #phone para evitar el bug de iOS WebKit: position:fixed dentro de overflow:hidden no ancla al viewport real -->
    <nav class="tabbar" id="tabbar" role="tablist" aria-label="Secciones">
        <button type="button" data-tab="today" class="on" role="tab" aria-selected="true"><svg viewBox="0 0 24 24"
                fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true">
                <circle cx="12" cy="12" r="4" />
                <path
                    d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.5 1.5M17.2 17.2l1.5 1.5M18.7 5.3l-1.5 1.5M6.8 17.2l-1.5 1.5" />
            </svg><span>Hoy</span></button>
        <button type="button" data-tab="calendar" role="tab" aria-selected="false"><svg viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true">
                <rect x="3.2" y="4.8" width="17.6" height="16" rx="3" />
                <path d="M3.2 9.8h17.6M8 2.8v4M16 2.8v4" />
            </svg><span>Calendario</span></button>
        <button type="button" data-tab="lists" role="tab" aria-selected="false"><svg viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true">
                <path d="M8.5 6h12M8.5 12h12M8.5 18h12" />
                <path d="M4 6h.01M4 12h.01M4 18h.01" stroke-width="2.8" />
            </svg><span>Listas</span></button>
    </nav>
    </div>
    <script type="module" src="/src/main.tsx"></script>
</body>
</html>
